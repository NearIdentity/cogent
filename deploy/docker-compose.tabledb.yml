# PostgreSQL 16 with the pgvector extension for the table database (kg_tabledb.py). No passwords in this file:
#   cp deploy/tabledb.env.example deploy/.env        # then edit the two passwords (deploy/.env is git-ignored)
#   docker compose -f deploy/docker-compose.tabledb.yml up -d        # Compose reads deploy/.env (next to this file)
#   export COGENT_TABLEDB_DSN="postgresql://cogent:<COGENT_DB_PASSWORD>@127.0.0.1:5432/cogent"
#   python src/kg_tabledb.py build            # or: python src/kg_agent.py run --tables
# The passwords are applied only when the data volume is first created; changing them later needs ALTER USER (or `down -v`, which deletes the data).
services:
  tabledb:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cogent
      POSTGRES_PASSWORD: ${COGENT_DB_PASSWORD:?set COGENT_DB_PASSWORD in deploy/.env}
      POSTGRES_DB: cogent
      COGENT_RO_PASSWORD: ${COGENT_RO_PASSWORD:?set COGENT_RO_PASSWORD in deploy/.env}
    ports: ["127.0.0.1:5432:5432"]          # loopback only
    volumes:
      - tabledb_data:/var/lib/postgresql/data
      - ./tabledb-init.sh:/docker-entrypoint-initdb.d/10-readonly-role.sh:ro
      - ./tabledb-readonly-role.sql:/tabledb-readonly-role.sql:ro
volumes:
  tabledb_data: {}
