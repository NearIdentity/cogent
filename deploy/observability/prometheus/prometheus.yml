# Prometheus for the cogent MCP server and agent. Started by docker-compose.observability.yml (host network, so it can reach the
# server that listens on 127.0.0.1:8765).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # One target shows everything: the MCP server's live metrics (HTTP, tools, cache, embedder, LLM calls it makes) and the daily agent's totals,
  # which the server merges in from <home>/metrics/ (see docs/observability.md). The server must run with --metrics.
  - job_name: cogent
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/mcp_token      # a token from `kg_mcp.py token create --name prometheus`
    static_configs:
      - targets: ["127.0.0.1:8765"]
        labels:
          instance: cogent-mcp

  # The conversational agent (kg_chat_app.py web --metrics): its own LLM calls (service="chat" in the cogent_llm_* metrics), questions and MCP calls. The
  # LLM panels add this job to the agent and the MCP server. Needs `export COGENT_CHAT_METRICS_TOKEN=...` when the app starts; the same value goes into
  # deploy/observability/prometheus/chat_token. Remove this job if you do not run the chat client.
  - job_name: cogent-chat
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/chat_token
    static_configs:
      - targets: ["127.0.0.1:5000"]
        labels:
          instance: cogent-chat

  # Optional: the agent on a host with no MCP server, via a Pushgateway (kg_agent.py run --pushgateway http://127.0.0.1:9091).
  # - job_name: pushgateway
  #   honor_labels: true
  #   static_configs: [{targets: ["127.0.0.1:9091"]}]
